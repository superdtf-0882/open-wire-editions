name: Heartbeat

# REQ-OPS-3. Two separate jobs of work, and the second is the one that matters:
#   1. commit a heartbeat file, which keeps the repository active and so keeps
#      GitHub from auto-disabling the schedule after 60 days of inactivity;
#   2. CHECK THAT PUBLICATION IS ACTUALLY HAPPENING, and fail loudly if not.
#
# A heartbeat that only did the first would MASK the failure it exists to
# surface: the repository would look healthy while publishing nothing.
#
# DAILY, NOT WEEKLY. The previous version ran Mondays. Against a twice-daily
# digest that is up to 14 missed editions before anything is raised -- and it
# meant the workflow had never run at all, having been created on a Tuesday.
#
# THE FRESHNESS CHECK NOW LIVES IN tools/heartbeat-check.js, NOT IN THIS FILE.
# The previous version was four lines of inline shell whose first branch read
# "no edition file? warning, exit 0", so a pipeline that had NEVER published
# looked healthy forever -- which was the live state on 2026-09-01/02. The hole
# was in a branch nothing could test. Moving it to a script IS the fix; the
# changed verdict is a consequence of being able to test it.

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --omit=dev

      - name: Keep the repository active
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/HEARTBEAT
          git config user.name  "open-wire-bot"
          git config user.email "open-wire-bot@users.noreply.github.com"
          git add .github/HEARTBEAT
          git diff --staged --quiet || { git commit -m "Heartbeat"; git push; }

      # Runs even if the commit step failed: a repository that cannot be
      # written to is exactly when you want to know whether it is publishing.
      - name: Confirm the generate schedule is still armed
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${{ github.repository }}/actions/workflows/generate.yml" --jq .state)
          echo "generate.yml state: $state"
          if [ "$state" != "active" ]; then
            echo "::error::generate.yml is '$state', not 'active'. The schedule is NOT armed and no editions are being produced."
            exit 1
          fi

      # The check the old version could not make. Exits non-zero on ERROR --
      # armed and never published, or an edition past the missed-slot
      # threshold. See tools/heartbeat-check.js for what it still cannot see.
      - name: Confirm publication is actually happening
        if: always()
        run: node tools/heartbeat-check.js
